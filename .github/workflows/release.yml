name: Release

# Push a tag like `v1.2.0` to build a signed release APK and attach it
# to a GitHub Release. Requires these repository secrets:
#   RDR_KEYSTORE_BASE64  - base64 of the upload keystore (android/app/my-release-key.jks)
#   RDR_KEYSTORE_PASSWORD
#   RDR_KEY_ALIAS
#   RDR_KEY_PASSWORD
# Generate the base64 secret with: base64 -w0 android/app/my-release-key.jks

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so generate_release_notes can diff against the
          # previous tag.
          fetch-depth: 0

      # Fails in seconds instead of ten minutes into a Gradle build.
      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RDR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RDR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RDR_KEY_PASSWORD }}
        run: |
          missing=0
          for var in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing repository secret for $var"
              missing=1
            fi
          done
          exit "$missing"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # capacitor.build.gradle compiles everything at Java 21.
          java-version: '21'

      # Validates the wrapper checksum and caches the Gradle user home.
      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build web bundle
        run: |
          bun test
          bun run build

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Resolve version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          # Strip anything non-numeric so suffixes like -beta.1 cannot break
          # the arithmetic below.
          major="${major//[^0-9]/}"
          minor="${minor//[^0-9]/}"
          patch="${patch//[^0-9]/}"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          {
            echo "name=$version"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$version versionCode=$code"

      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RDR_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.jks

      - name: Verify keystore and alias
        env:
          STORE_PASSWORD: ${{ secrets.RDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RDR_KEY_ALIAS }}
        run: |
          test -s android/app/my-release-key.jks
          if ! keytool -list -keystore android/app/my-release-key.jks -storepass "$STORE_PASSWORD" > /tmp/ks.txt 2>/tmp/ks.err; then
            echo "::error::keytool could not open the keystore (wrong RDR_KEYSTORE_PASSWORD?)"
            cat /tmp/ks.err >&2
            exit 1
          fi
          if ! grep -F -q "$KEY_ALIAS" /tmp/ks.txt; then
            echo "::error::Key alias not found in keystore. Entries in keystore:"
            cat /tmp/ks.txt
            exit 1
          fi

      - name: Write signing config
        env:
          STORE_PASSWORD: ${{ secrets.RDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RDR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RDR_KEY_PASSWORD }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } > android/local.properties

      - name: Build release APK
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        # :- defaults keep an empty output from ever reaching Gradle as "".
        run: >-
          ./gradlew assembleRelease --console=plain --stacktrace
          -PversionCode="${VERSION_CODE:-1}"
          -PversionName="${VERSION_NAME:-1.0}"

      - name: Rename artifact
        run: mv android/app/build/outputs/apk/release/app-release.apk "rdr-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: rdr ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: rdr-${{ github.ref_name }}.apk
